<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#030712">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Flappy Spaceship - Airspace Runner</title>
  <style>
    /* Reset and mobile-viewport lock */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #020617;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 480px;
      max-height: 920px;
      background: #030712;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(56, 189, 248, 0.15);
      overflow: hidden;
      display: flex;
    }

    @media (min-width: 481px) {
      #app-container {
        border-radius: 20px;
        border: 1px solid rgba(56, 189, 248, 0.25);
        height: min(95vh, 860px);
      }
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Modern Glassmorphic UI Overlays */
    .screen-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.82) 0%, rgba(2, 6, 23, 0.94) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.25s ease, visibility 0.25s ease;
      text-align: center;
    }

    .screen-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .game-title {
      font-size: clamp(2rem, 6.5vw, 2.75rem);
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.6));
    }

    .game-subtitle {
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .stats-card {
      width: 100%;
      max-width: 290px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      padding: 18px 22px;
      margin-bottom: 26px;
      box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.06);
    }

    .stat-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0;
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .stat-num {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.3rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .stat-num.gold {
      color: #facc15;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
    }

    .cyber-btn {
      width: 100%;
      max-width: 280px;
      min-height: 56px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(99, 102, 241, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: transform 0.15s ease, filter 0.15s ease;
      -webkit-user-select: none;
    }

    .cyber-btn:active {
      transform: scale(0.96);
      filter: brightness(1.2);
    }

    .tip-text {
      color: #64748b;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
      margin-top: 18px;
    }

    /* Sound toggle */
    #sound-btn {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      z-index: 20;
      width: 44px;
      height: 44px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 50%;
      color: #38bdf8;
      font-size: 1.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <div id="app-container">
    <button id="sound-btn" aria-label="Toggle Sound">🔊</button>
    <canvas id="gameCanvas"></canvas>

    <!-- Start / Launch Overlay -->
    <div id="start-overlay" class="screen-overlay">
      <div class="game-title">AIRSPACE</div>
      <div class="game-subtitle">CYBER SPACESHIP RUNNER</div>

      <div class="stats-card">
        <div class="stat-line">
          <span>Flight Control</span>
          <span style="color:#34d399">Calibrated</span>
        </div>
        <div class="stat-line">
          <span>All-Time Record</span>
          <span id="start-record" class="stat-num gold">0</span>
        </div>
      </div>

      <button id="launch-button" class="cyber-btn">
        <span>🚀 LAUNCH SHIP</span>
      </button>
      <p class="tip-text">TAP ANYWHERE TO ENGAGE THRUSTERS</p>
    </div>

    <!-- Crash / Game Over Overlay -->
    <div id="gameover-overlay" class="screen-overlay hidden">
      <div class="game-title" style="background: linear-gradient(135deg, #f43f5e 0%, #fb923c 100%); -webkit-background-clip: text;">
        CRASHED
      </div>
      <div id="gameover-tagline" class="game-subtitle">SIGNAL LOST</div>

      <div class="stats-card">
        <div class="stat-line">
          <span>Sector Score</span>
          <span id="end-score" class="stat-num">0</span>
        </div>
        <div class="stat-line">
          <span>Personal Best</span>
          <span id="end-high-score" class="stat-num gold">0</span>
        </div>
        <div class="stat-line">
          <span>Cores Absorbed</span>
          <span id="end-cores" class="stat-num" style="color:#38bdf8">0</span>
        </div>
      </div>

      <button id="restart-button" class="cyber-btn">
        <span>🔄 RELAUNCH SHIP</span>
      </button>
      <p class="tip-text">TAP OR PRESS SPACEBAR TO RETRY</p>
    </div>
  </div>

  <script>
    const Sound = {
      ctx: null,
      muted: false,

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      },

      thrust() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(190, t);
          osc.frequency.exponentialRampToValueAtTime(70, t + 0.14);
          gain.gain.setValueAtTime(0.18, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.14);
        } catch (e) {}
      },

      score() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(540, t);
          osc.frequency.setValueAtTime(840, t + 0.08);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.22);
        } catch (e) {}
      },

      shield() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(360, t);
          osc.frequency.linearRampToValueAtTime(720, t + 0.12);
          osc.frequency.linearRampToValueAtTime(1080, t + 0.24);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.28);
        } catch (e) {}
      },

      crash() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const length = this.ctx.sampleRate * 0.4;
          const buffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < length; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (length * 0.2));
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(800, t);
          filter.frequency.exponentialRampToValueAtTime(40, t + 0.4);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.4, t);
          gain.gain.linearRampToValueAtTime(0.001, t + 0.4);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(t);
        } catch (e) {}
      }
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('app-container');

    let W = 400;
    let H = 700;

    function resize() {
      const rect = container.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      W = rect.width;
      H = rect.height;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 120));
    resize();

    const STATE = { READY: 0, PLAYING: 1, GAMEOVER: 2 };
    let currentState = STATE.READY;
    let score = 0;
    let coresCollected = 0;
    let highScore = parseInt(localStorage.getItem('flappy_spaceship_record') || '0', 10);
    let speedMult = 1.0;
    let totalTime = 0;
    let screenShake = 0;
    let spawnCounter = 0;

    // Mobile-tuned balanced medium physics
    const PHYSICS = {
      gravity: 580,          // Gentle, floating gravity (not rapid drop)
      jumpImpulse: -280,     // Responsive upward impulse
      terminalVel: 420,      // Safe speed cap
      baseSpeed: 170,        // Comfortable scroll velocity
      gapSize: 185           // Fair clearance window
    };

    const stars = [];
    const NUM_STARS = 65;
    for (let i = 0; i < NUM_STARS; i++) {
      stars.push({
        x: Math.random() * 600,
        y: Math.random() * 900,
        size: Math.random() * 1.8 + 0.6,
        speed: Math.random() * 30 + 12,
        alpha: Math.random() * 0.75 + 0.25,
        color: ['#38bdf8', '#818cf8', '#e2e8f0', '#c084fc'][Math.floor(Math.random() * 4)]
      });
    }

    const particles = [];
    function emitThruster(x, y, angle) {
      for (let i = 0; i < 2; i++) {
        const spread = (Math.random() - 0.5) * 0.45;
        const vel = Math.random() * 140 + 70;
        particles.push({
          x: x - Math.cos(angle) * 16,
          y: y - Math.sin(angle) * 16,
          vx: -Math.cos(angle + spread) * vel,
          vy: -Math.sin(angle + spread) * vel,
          life: 1.0,
          decay: Math.random() * 3.5 + 3.0,
          size: Math.random() * 3 + 2,
          color: Math.random() > 0.4 ? '#38bdf8' : '#f43f5e'
        });
      }
    }

    function emitExplosion(x, y) {
      for (let i = 0; i < 40; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 260 + 40;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          decay: Math.random() * 1.8 + 1.2,
          size: Math.random() * 4 + 2,
          color: ['#f43f5e', '#fb923c', '#38bdf8', '#facc15'][Math.floor(Math.random() * 4)]
        });
      }
    }

    function emitShieldSpark(x, y) {
      for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 160 + 30;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          decay: Math.random() * 2.2 + 2.0,
          size: Math.random() * 2.5 + 1.5,
          color: '#38bdf8'
        });
      }
    }

    const ship = {
      x: 90,
      y: 350,
      radius: 12,       // Forgiving inner circle hitbox
      vy: 0,
      angle: 0,
      targetAngle: 0,
      shieldTime: 0,

      reset() {
        this.x = Math.max(75, W * 0.22);
        this.y = H * 0.48;
        this.vy = 0;
        this.angle = 0;
        this.targetAngle = 0;
        this.shieldTime = 0;
      },

      thrust() {
        Sound.thrust();
        this.vy = PHYSICS.jumpImpulse;
        this.targetAngle = -0.38;
      },

      update(dt) {
        if (currentState === STATE.READY) {
          // Harmonic hovering wave: Ship never plummets on start!
          this.y = H * 0.48 + Math.sin(totalTime * 3.8) * 14;
          this.angle = Math.sin(totalTime * 3.0) * 0.07;
          return;
        }

        // Apply physics
        this.vy += PHYSICS.gravity * dt;
        if (this.vy > PHYSICS.terminalVel) {
          this.vy = PHYSICS.terminalVel;
        }
        this.y += this.vy * dt;

        // Dynamic visual rotation
        if (this.vy < 0) {
          this.targetAngle = -0.35;
        } else {
          this.targetAngle = Math.min(Math.PI / 3.4, (this.vy / PHYSICS.terminalVel) * 1.15);
        }
        this.angle += (this.targetAngle - this.angle) * 10 * dt;

        // Exhaust
        emitThruster(this.x, this.y, this.angle);

        // Shield countdown
        if (this.shieldTime > 0) {
          this.shieldTime -= dt;
        }
      },

      draw(c) {
        c.save();
        c.translate(this.x, this.y);
        c.rotate(this.angle);

        // Active Plasma Shield Bubble
        if (this.shieldTime > 0) {
          c.beginPath();
          c.arc(0, 0, this.radius + 11, 0, Math.PI * 2);
          c.strokeStyle = 'rgba(56, 189, 248, 0.85)';
          c.lineWidth = 2.5;
          c.shadowColor = '#38bdf8';
          c.shadowBlur = 14;
          c.stroke();
          c.fillStyle = 'rgba(56, 189, 248, 0.15)';
          c.fill();
        }

        // Hull rendering
        c.shadowColor = '#38bdf8';
        c.shadowBlur = 10;

        c.beginPath();
        c.moveTo(20, 0);               // Tip
        c.lineTo(-12, -12);            // Wing upper
        c.lineTo(-6, -4);              // Upper hull intake
        c.lineTo(-15, 0);              // Rear exhaust nozzle
        c.lineTo(-6, 4);               // Lower hull intake
        c.lineTo(-12, 12);             // Wing lower
        c.closePath();

        const grad = c.createLinearGradient(-15, -12, 20, 12);
        grad.addColorStop(0, '#1e293b');
        grad.addColorStop(0.5, '#38bdf8');
        grad.addColorStop(1, '#0284c7');
        c.fillStyle = grad;
        c.fill();
        c.lineWidth = 1.6;
        c.strokeStyle = '#e0f2fe';
        c.stroke();

        // Cockpit glass
        c.beginPath();
        c.ellipse(4, 0, 6.5, 3.2, 0, 0, Math.PI * 2);
        c.fillStyle = '#f8fafc';
        c.shadowColor = '#a855f7';
        c.shadowBlur = 6;
        c.fill();

        // Glowing Engine Core
        c.beginPath();
        c.rect(-16, -3, 3, 6);
        c.fillStyle = '#f43f5e';
        c.shadowColor = '#f43f5e';
        c.shadowBlur = 10;
        c.fill();

        c.restore();
      }
    };

    const obstacles = [];
    const pickups = [];

    function spawnHazard() {
      // Pick hazard variety
      let type = 'pylon';
      const roll = Math.random();
      if (score >= 8) {
        if (roll > 0.65) type = 'laser';
        else if (roll > 0.35) type = 'asteroid';
      }

      // Responsive fair gap calculation
      const gap = Math.max(158, PHYSICS.gapSize - Math.floor(score / 10) * 3);
      const minPadding = 80;
      const maxGapY = H - gap - minPadding;
      const gapY = Math.floor(Math.random() * (maxGapY - minPadding)) + minPadding;
      const width = 64;

      obstacles.push({
        x: W + 20,
        width,
        gapY,
        gap,
        type,
        passed: false,
        pulseSeed: Math.random() * Math.PI * 2,
        laserActive: true
      });

      // Spawn energy pickup orb in corridor
      if (Math.random() < 0.65) {
        pickups.push({
          x: W + 20 + width / 2,
          y: gapY + gap / 2 + (Math.random() - 0.5) * (gap * 0.4),
          radius: 9,
          baseY: gapY + gap / 2,
          wobbleOffset: Math.random() * Math.PI * 2,
          collected: false
        });
      }
    }

    function circleRectCollision(cx, cy, cr, rx, ry, rw, rh) {
      const closestX = Math.max(rx, Math.min(cx, rx + rw));
      const closestY = Math.max(ry, Math.min(cy, ry + rh));
      const dx = cx - closestX;
      const dy = cy - closestY;
      return (dx * dx + dy * dy) < (cr * cr);
    }

    function triggerCrash() {
      currentState = STATE.GAMEOVER;
      Sound.crash();
      emitExplosion(ship.x, ship.y);

      screenShake = 0.4;

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('flappy_spaceship_record', highScore.toString());
      }

      document.getElementById('end-score').innerText = score;
      document.getElementById('end-high-score').innerText = highScore;
      document.getElementById('end-cores').innerText = coresCollected;
      document.getElementById('start-record').innerText = highScore;

      const tagline = document.getElementById('gameover-tagline');
      if (score >= 35) tagline.innerText = 'LEGENDARY AIRSPACE PILOT';
      else if (score >= 18) tagline.innerText = 'CYBER FLEET ACE';
      else tagline.innerText = 'NAVIGATION COMPROMISED';

      setTimeout(() => {
        document.getElementById('gameover-overlay').classList.remove('hidden');
      }, 350);
    }

    function update(dt) {
      totalTime += dt;

      if (screenShake > 0) {
        screenShake -= dt;
      }

      // Parallax star motion
      const curSpeed = (currentState === STATE.PLAYING ? PHYSICS.baseSpeed * speedMult : PHYSICS.baseSpeed * 0.35);
      for (const s of stars) {
        s.x -= (s.speed + curSpeed * 0.1) * dt;
        if (s.x < -10) {
          s.x = W + 10;
          s.y = Math.random() * H;
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= p.decay * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Ship update
      ship.update(dt);

      if (currentState !== STATE.PLAYING) return;

      // Soft boundary checks
      if (ship.y - ship.radius < 0) {
        ship.y = ship.radius;
        ship.vy = 0;
      }
      if (ship.y + ship.radius > H - 18) {
        triggerCrash();
        return;
      }

      // Hazard spawning intervals
      spawnCounter += dt;
      const spawnInterval = Math.max(1.3, 2.0 / speedMult);
      if (spawnCounter >= spawnInterval) {
        spawnCounter = 0;
        spawnHazard();
      }

      // Obstacle interactions
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= curSpeed * dt;

        // Score tracking
        if (!obs.passed && obs.x + obs.width < ship.x) {
          obs.passed = true;
          score++;
          Sound.score();
          // Increase speed by 5% every 10 points
          speedMult = 1.0 + Math.floor(score / 10) * 0.05;
        }

        const topH = obs.gapY;
        const botY = obs.gapY + obs.gap;
        const botH = H - botY;

        // Collision with top or bottom conduits
        const hitTop = circleRectCollision(ship.x, ship.y, ship.radius, obs.x, 0, obs.width, topH);
        const hitBot = circleRectCollision(ship.x, ship.y, ship.radius, obs.x, botY, obs.width, botH);

        // Laser beam collision
        let hitLaser = false;
        if (obs.type === 'laser') {
          obs.laserActive = Math.sin(totalTime * 6.5 + obs.pulseSeed) > -0.65;
          if (obs.laserActive && circleRectCollision(ship.x, ship.y, ship.radius * 0.75, obs.x + obs.width * 0.42, topH, obs.width * 0.16, obs.gap)) {
            hitLaser = true;
          }
        }

        // Asteroid collision
        let hitAsteroid = false;
        if (obs.type === 'asteroid') {
          const astX = obs.x + obs.width / 2;
          const astY = obs.gapY - 16;
          const dist = Math.hypot(ship.x - astX, ship.y - astY);
          if (dist < ship.radius + 15) {
            hitAsteroid = true;
          }
        }

        if (hitTop || hitBot || hitLaser || hitAsteroid) {
          if (ship.shieldTime > 0) {
            // Absorb impact via energy shield
            ship.shieldTime = 0;
            emitShieldSpark(ship.x, ship.y);
            obs.x = -150; // Destroy obstacle
          } else {
            triggerCrash();
            return;
          }
        }

        if (obs.x + obs.width < -40) {
          obstacles.splice(i, 1);
        }
      }

      // Pickup interactions
      for (let i = pickups.length - 1; i >= 0; i--) {
        const item = pickups[i];
        item.x -= curSpeed * dt;
        item.y = item.baseY + Math.sin(totalTime * 5.0 + item.wobbleOffset) * 12;

        const dist = Math.hypot(ship.x - item.x, ship.y - item.y);
        if (!item.collected && dist < ship.radius + item.radius) {
          item.collected = true;
          coresCollected++;
          score += 2;
          Sound.shield();
          emitShieldSpark(item.x, item.y);

          // Activate shield for 3.5 seconds
          ship.shieldTime = 3.5;
        }

        if (item.collected || item.x < -30) {
          pickups.splice(i, 1);
        }
      }
    }

    function render() {
      ctx.save();

      // Screen shake
      if (screenShake > 0) {
        const intensity = 12;
        const dx = (Math.random() - 0.5) * intensity;
        const dy = (Math.random() - 0.5) * intensity;
        ctx.translate(dx, dy);
      }

      // Cosmic background
      const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
      skyGrad.addColorStop(0, '#030712');
      skyGrad.addColorStop(0.55, '#0b1120');
      skyGrad.addColorStop(1, '#020617');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, H);

      // Starfield
      for (const s of stars) {
        ctx.fillStyle = s.color;
        ctx.globalAlpha = s.alpha;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;

      // Obstacles
      for (const obs of obstacles) {
        const topH = obs.gapY;
        const botY = obs.gapY + obs.gap;
        const botH = H - botY;

        // Pylon shading
        const pylonGrad = ctx.createLinearGradient(obs.x, 0, obs.x + obs.width, 0);
        pylonGrad.addColorStop(0, '#1e293b');
        pylonGrad.addColorStop(0.4, '#334155');
        pylonGrad.addColorStop(1, '#0f172a');

        ctx.fillStyle = pylonGrad;
        ctx.fillRect(obs.x, 0, obs.width, topH);
        ctx.fillRect(obs.x, botY, obs.width, botH);

        // Neon cyber rim
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(obs.x, -2, obs.width, topH + 2);
        ctx.strokeRect(obs.x, botY, obs.width, botH + 2);

        // Conduit emitters
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(obs.x - 2, topH - 12, obs.width + 4, 12);
        ctx.fillRect(obs.x - 2, botY, obs.width + 4, 12);

        // Hazard stripes on emitters
        ctx.fillStyle = '#facc15';
        ctx.fillRect(obs.x + 6, topH - 5, obs.width - 12, 3);
        ctx.fillRect(obs.x + 6, botY + 2, obs.width - 12, 3);

        // Pulsing Laser Hazard
        if (obs.type === 'laser' && obs.laserActive) {
          ctx.save();
          const midX = obs.x + obs.width / 2;
          ctx.strokeStyle = '#f43f5e';
          ctx.shadowColor = '#f43f5e';
          ctx.shadowBlur = 16;
          ctx.lineWidth = 3.5 + Math.sin(totalTime * 18) * 1.5;
          ctx.beginPath();
          ctx.moveTo(midX, topH);
          ctx.lineTo(midX, botY);
          ctx.stroke();

          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.2;
          ctx.stroke();
          ctx.restore();
        }

        // Floating Asteroid Rock
        if (obs.type === 'asteroid') {
          ctx.save();
          ctx.translate(obs.x + obs.width / 2, obs.gapY - 16);
          ctx.rotate(totalTime * 1.3);
          ctx.fillStyle = '#475569';
          ctx.beginPath();
          ctx.moveTo(-12, -7);
          ctx.lineTo(0, -14);
          ctx.lineTo(13, -7);
          ctx.lineTo(14, 6);
          ctx.lineTo(3, 14);
          ctx.lineTo(-11, 10);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 1.4;
          ctx.stroke();
          ctx.restore();
        }
      }

      // Energy Pickups
      for (const item of pickups) {
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 12;

        ctx.strokeStyle = 'rgba(56, 189, 248, 0.85)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.arc(0, 0, item.radius * 0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Particles
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Ship
      ship.draw(ctx);

      // Floor & ceiling boundary lines
      ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
      ctx.fillRect(0, H - 16, W, 16);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, H - 16);
      ctx.lineTo(W, H - 16);
      ctx.stroke();

      // HUD
      if (currentState === STATE.PLAYING) {
        ctx.save();
        // Live Score
        ctx.font = '900 34px ui-monospace, monospace';
        ctx.fillStyle = '#f8fafc';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 12;
        ctx.fillText(score, W / 2, 54);

        // Speed Factor
        ctx.font = '600 12px -apple-system, sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.shadowBlur = 0;
        ctx.fillText(`WARP: ${speedMult.toFixed(2)}x`, W / 2, 74);

        // Shield status indicator
        if (ship.shieldTime > 0) {
          ctx.fillStyle = '#38bdf8';
          ctx.fillText(`SHIELD: ${ship.shieldTime.toFixed(1)}s`, W / 2, 94);
        }
        ctx.restore();
      }

      ctx.restore();
    }

    let lastTime = performance.now();
    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      update(dt);
      render();

      requestAnimationFrame(gameLoop);
    }

    function handleAction(e) {
      if (e) {
        if (e.cancelable) e.preventDefault();
      }
      Sound.init();

      if (currentState === STATE.READY) {
        document.getElementById('start-overlay').classList.add('hidden');
        currentState = STATE.PLAYING;
        ship.thrust();
      } else if (currentState === STATE.PLAYING) {
        ship.thrust();
      }
    }

    function restart() {
      score = 0;
      coresCollected = 0;
      speedMult = 1.0;
      obstacles.length = 0;
      pickups.length = 0;
      particles.length = 0;
      spawnCounter = 0;
      ship.reset();

      document.getElementById('gameover-overlay').classList.add('hidden');
      currentState = STATE.PLAYING;
      ship.thrust();
    }

    // Touch & Pointer Listeners
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      handleAction(e);
    });

    // Keyboard support (Space & Up Arrow)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (currentState === STATE.GAMEOVER) {
          restart();
        } else {
          handleAction(e);
        }
      }
    });

    // Button Triggers
    document.getElementById('launch-button').addEventListener('click', (e) => {
      e.stopPropagation();
      handleAction(e);
    });

    document.getElementById('restart-button').addEventListener('click', (e) => {
      e.stopPropagation();
      restart();
    });

    // Audio Toggle Button
    const soundBtn = document.getElementById('sound-btn');
    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      Sound.muted = !Sound.muted;
      soundBtn.innerText = Sound.muted ? '🔇' : '🔊';
    });

    // Populate initial High Score
    document.getElementById('start-record').innerText = highScore;

    // Boot the game loop
    window.onload = function() {
      resize();
      ship.reset();
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
